# ─────────────────────────────────────────────────────────────────────────────
# PIPELINE SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

site_title: "Sri Lanka Digital Industry News"
timezone: "Asia/Colombo"

# How far back to look on each run. Normally the window starts at the previous
# successful run (so nothing is missed or repeated); if there is no previous run,
# or it was longer ago than max_window_hours, the last window_hours are used.
window_hours: 24
max_window_hours: 36

# ── Gemini ──────────────────────────────────────────────────────────────────
# The model can be overridden without editing this file by setting the
# GEMINI_MODEL repository variable in GitHub.
gemini_model: "gemini-3.5-flash-lite"
# Seconds to wait between Gemini calls (keeps us under free-tier per-minute limits).
gemini_min_interval_seconds: 6
# Items per Gemini call. Bigger batches = fewer requests per day.
triage_batch_size: 40
summary_batch_size: 10
# Characters of article text sent to Gemini per article for the summary.
article_chars_for_summary: 1800
# Minimum relevance score (0-10) for a story to count as relevant to the team.
# Stories below this are NOT deleted: they are kept under "Out of scope" (see below) so the
# team can still look at them, but they never appear in the main category filters.
min_relevance: 5
# Max out-of-scope stories kept per run (newest first). Keeps the data file small.
max_out_of_scope_per_day: 100
# Safety cap on stories per day (highest relevance kept) to protect the free quota.
max_items_per_day: 300

# ── Article fetching ────────────────────────────────────────────────────────
fetch_timeout_seconds: 15
fetch_workers: 8

# ── Categories (shown as filters on the site, in this order) ───────────────
# 'description' guides the AI. 'keywords' are only used as a fallback when
# Gemini is unavailable (e.g. quota exhausted).
categories:
  - name: "Startups & Ecosystem"
    description: "Startups, founders, accelerators, incubators, startup competitions, hackathons, pitch events, angel/VC investment and funding rounds."
    keywords: [startup, start-up, founder, accelerator, incubator, xcellerator, hackathon, pitch, venture, angel, seed, funding round, raises]
  - name: "Tech Industry & SMEs"
    description: "Tech companies, IT/BPM and software exports, telecoms, AI, cybersecurity, tech talent and skills, plus small and medium enterprises (SMEs/MSMEs): SME digitalisation, SME support schemes, SME financing and exporters, where there is a digital or tech angle."
    keywords: [software, it/bpm, bpm, tech, technology, slasscom, telecom, ai, artificial intelligence, cyber, developer, data centre, data center, cloud, sme, smes, msme, small and medium, small business]
  - name: "Digital Economy & Policy"
    description: "Government digital economy policy and strategy, ICTA, the Ministry of Digital Economy, regulation (data protection, online safety, telecom), digital public infrastructure."
    keywords: [digital economy, icta, ministry of digital, policy, regulation, data protection, digital id, digital public infrastructure, act, bill]
  - name: "Digitalization"
    description: "Digital transformation of businesses and government services, fintech, digital payments, e-commerce, online services."
    keywords: [digital, digitali, fintech, payment, e-commerce, ecommerce, online, app, platform, qr, lankapay]
  - name: "Entrepreneurship"
    description: "Entrepreneurs and entrepreneurship: entrepreneur networks and platforms, women and youth entrepreneurs, entrepreneurship programmes, training, mentoring and business-support schemes, where there is a digital or tech angle. (Funded tech startups, accelerators and VC deals belong in Startups & Ecosystem.)"
    keywords: [entrepreneur, entrepreneurs, entrepreneurship, self-employed, women entrepreneurs, youth entrepreneurs, mentoring]
  - name: "Economy & Business"
    description: "Macroeconomy, Central Bank, IMF, budget, trade, exports, investment, corporate results and other business news."
    keywords: [economy, economic, cbsl, central bank, imf, gdp, inflation, budget, export, trade, investment, rupee, tax, tariff, plc, profit, revenue]
  - name: "Global Tech"
    description: "International technology-sector news that has no Sri Lanka link: AI, software and cloud, cybersecurity, semiconductors, big-tech companies, telecoms, tech startups, funding and IPOs, and tech regulation in other countries. Mostly from outlets such as BBC and CNN."
    keywords: [nvidia, openai, anthropic, microsoft, google, apple, meta, amazon, semiconductor, chip, chatbot, cybersecurity, ransomware, data breach, silicon valley]
  - name: "Events & Opportunities"
    description: "Upcoming or just-held conferences, summits, workshops, calls for applications, grants, programmes and deadlines relevant to the digital industry."
    keywords: [summit, conference, forum, workshop, expo, applications open, call for, deadline, launch event, webinar, awards]

# ── Out-of-scope groups ─────────────────────────────────────────────────────
# Stories that fail the digital-angle test are filed into one of these groups and shown
# only when someone clicks the "Out of scope" button on the site. 'description' guides the AI.
# The LAST group is the catch-all, so keep it last.
out_of_scope_categories:
  - name: "Macro & Economy"
    description: "Budget, CBSL, IMF, inflation, interest rates, exchange rates, stock market, trade and tax news with NO digital/IT angle."
  - name: "Corporate News"
    description: "Company or bank MoUs, sponsorships, awards, CSR, product launches, appointments, marketing campaigns and results with no digital angle."
  - name: "Other Sectors"
    description: "General business and non-digital sectors: agriculture, fisheries, food, manufacturing, tourism, energy, construction, real estate, transport."
  - name: "Fact-checks, Incidents & Opinion"
    description: "Fact-checks, accidents, fires, environmental or safety incidents, and opinion or commentary pieces."
  - name: "Unrelated"
    description: "Everything else: politics, crime, sport, entertainment, weather, obituaries, space and science, consumer gadgets, general world news, or anything with no tech or Sri Lanka connection."

